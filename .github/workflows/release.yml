name: build-and-release

# Every push and pull request: lint, build, syntax-check and test the plugin.
# A tag like v0.1.0 (stable) or v0.2.0-beta.1 (beta, published as a pre-release)
# also publishes a GitHub Release with the zip, its SHA-256 and latest.json.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.4
        run: sudo apt-get update -q && sudo apt-get install -y -q lua5.4

      - name: Work out version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint, build and package
        shell: pwsh
        run: ./tools/build-plugin.ps1 -Version "${{ steps.version.outputs.version }}" -Repo "${{ github.repository }}"

      - name: Syntax check (luac -p)
        run: luac5.4 -p dist/utilitybelt/main.lua

      - name: Tests
        run: lua5.4 tools/test/run_tests.lua dist/utilitybelt/main.lua tools/test/cases/*.lua

      - name: Verify checksum
        working-directory: dist
        run: sha256sum -c utilitybelt-*.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/*.zip
            dist/*.sha256
            dist/latest.json

  release:
    needs: plugin
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=""
          if [[ "$TAG" == *-* ]]; then flags="--prerelease"; fi
          gh release create "$TAG" dist/*.zip dist/*.sha256 dist/latest.json \
            --repo "$GITHUB_REPOSITORY" --title "UtilityBelt $TAG" --generate-notes $flags
