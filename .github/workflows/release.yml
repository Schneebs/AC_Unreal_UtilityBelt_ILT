name: build-and-release

# Every push and pull request: lint, build, syntax-check and test the plugin, and build
# UB Manager. A tag like v0.1.0 (stable) or v0.2.0-beta.1 (beta, published as a
# pre-release) also publishes a GitHub Release with both, their SHA-256s and latest.json.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

  plugin:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.4
        run: sudo apt-get update -q && sudo apt-get install -y -q lua5.4

      - name: Lint, build and package
        shell: pwsh
        run: ./tools/build-plugin.ps1 -Version "${{ needs.version.outputs.version }}" -Repo "${{ github.repository }}"

      - name: Syntax check (luac -p)
        run: luac5.4 -p dist/utilitybelt/main.lua

      - name: Tests
        run: lua5.4 tools/test/run_tests.lua dist/utilitybelt/main.lua tools/test/cases/*.lua

      - name: Verify checksum
        working-directory: dist
        run: sha256sum -c utilitybelt-*.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: |
            dist/*.zip
            dist/*.sha256
            dist/latest.json

  manager:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build UB Manager
        shell: pwsh
        run: dotnet build manager/UBManager/UBManager.csproj -c Release -p:Version="${{ needs.version.outputs.version }}" -nologo

      - name: Smoke test (single exe, no side files)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item manager/UBManager/bin/Release/net48/UBManager.exe out/
          $p = Start-Process out/UBManager.exe -ArgumentList '--scan', 'missing-folder', '--log=out/smoke.txt' -Wait -PassThru
          Get-Content out/smoke.txt
          if ($p.ExitCode -ne 0) { throw "UB Manager smoke test failed ($($p.ExitCode))" }
          Remove-Item out/smoke.txt

      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash out/UBManager.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("out/UBManager.exe.sha256", "$h  UBManager.exe`n")

      - uses: actions/upload-artifact@v4
        with:
          name: manager
          path: out/UBManager.exe*

  release:
    needs: [version, plugin, manager]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Add UB Manager to latest.json
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          $latest = Get-Content dist/latest.json -Raw | ConvertFrom-Json
          $exe = Get-Item dist/UBManager.exe
          $latest.manager = [ordered]@{
            file    = 'UBManager.exe'
            version = $env:VERSION
            url     = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:TAG/UBManager.exe"
            sha256  = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
            size    = $exe.Length
          }
          [IO.File]::WriteAllText("dist/latest.json", ($latest | ConvertTo-Json -Depth 5), (New-Object Text.UTF8Encoding $false))
          Get-Content dist/latest.json

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=""
          if [[ "$TAG" == *-* ]]; then flags="--prerelease"; fi
          gh release create "$TAG" dist/*.zip dist/*.sha256 dist/UBManager.exe dist/latest.json \
            --repo "$GITHUB_REPOSITORY" --title "UtilityBelt $TAG" --generate-notes $flags
